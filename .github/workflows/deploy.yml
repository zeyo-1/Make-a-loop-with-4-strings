# main ブランチに push されるたびに、テスト → ビルド → GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions タブから手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: テスト（105通り・確率の検算）
        run: npm test

      - name: ビルド
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v5
